<!DOCTYPE html>
<html>
<head>
<title>Himalaya Trek Explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
margin:0;
font-family: 'Arial';
background:#0b0f19;
color:white;
}

.hero {
height:100vh;
background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470');
background-size:cover;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1 {
font-size:50px;
margin:0;
}

.hero p {
font-size:18px;
opacity:0.8;
}

.btn {
padding:12px 25px;
background:#ffcc00;
color:black;
border:none;
margin-top:20px;
cursor:pointer;
}

.section {
padding:50px;
text-align:center;
}

.card {
background:#1c1f2a;
padding:20px;
margin:10px;
display:inline-block;
width:250px;
border-radius:10px;
}

input, select, textarea {
width:90%;
padding:10px;
margin:8px;
}

form {
background:#1c1f2a;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
}
</style>
</head>

<body>

<div class="hero">
<h1>Himalaya Trek Explorer</h1>
<p>Not Just Travel — It's an Experience</p>
<button class="btn">Book Your Trek</button>
</div>

<div class="section">

<h2>Our Treks</h2>

<div class="card">Kedarkantha<br>5 Days</div>
<div class="card">Valley of Flowers<br>6 Days</div>
<div class="card">Har Ki Dun<br>7 Days</div>

</div>

<div class="section">

<h2>Book Now</h2>

<form action="/book" method="POST">

<input name="name" placeholder="Name">
<input name="email" placeholder="Email">
<input name="phone" placeholder="Phone">

<select name="trek">
<option>Kedarkantha</option>
<option>Valley of Flowers</option>
<option>Har Ki Dun</option>
</select>

<input name="people" placeholder="People">
<input name="days" placeholder="Days">

<textarea name="message" placeholder="Message"></textarea>

<button class="btn">Confirm Booking</button>

</form>

</div>

</body>
</html>
